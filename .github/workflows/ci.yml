# chatwire CI.
#
# One job, because chatwire is Windows-only.  It checks that the thing compiles
# on a machine that is not the author's and that chatwire.exe comes out carrying
# its library.  Everything that needs a running Minecraft -- the mappings, the
# hooks, every Java call -- is verified by injecting into a real game, by hand.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: windows-mingw
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # MSYS2 rather than MSVC: it is the toolchain chatwire is developed
      # against, so a green job here means the same thing the author's machine
      # means.
      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure and build
        shell: msys2 {0}
        run: |
          # Not -DCHATWIRE_WARNINGS_AS_ERRORS=ON.  chatwire's own TUs include
          # vmhook, and -Werror on a 26k-line third-party header turns somebody
          # else's diagnostic -- or the standard library's own inlining noise --
          # into a red build for this project.  Warnings are still printed.
          cmake -S . -B build/etc -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/etc

      # The exe carries the DLL as a resource, and a build where that silently
      # did not happen would still produce a working-looking chatwire.exe --
      # right up until somebody ran it on a machine with no build tree.  So the
      # size is checked: the injector on its own is nowhere near this big.
      - name: chatwire.exe carries its library
        shell: msys2 {0}
        run: |
          ls -l build/chatwire.exe
          test "$(stat -c%s build/chatwire.exe)" -gt 5000000
